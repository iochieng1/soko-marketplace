# Render Blueprint: https://render.com/docs/blueprint-spec
# The storefront (apps/storefront) deploys to Vercel, not Render.
services:
  - type: web
    name: soko-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: soko-db
          property: connectionString
      # Set these in the Render dashboard: they come from your PayBridge
      # merchant account and must never be committed.
      - key: PAYBRIDGE_API_URL
        sync: false
      - key: PAYBRIDGE_API_KEY
        sync: false
      - key: PAYBRIDGE_WEBHOOK_SECRET
        sync: false
      # Confirmation email (Resend) and SMS (Africa's Talking). Until these
      # are set, confirmations stay queued in the outbox and are retried.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: AFRICASTALKING_USERNAME
        sync: false
      - key: AFRICASTALKING_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: soko-redis
          property: connectionString

  - type: keyvalue
    name: soko-redis
    plan: free
    ipAllowList: [] # only reachable from services in this Render account

databases:
  - name: soko-db
    plan: free
