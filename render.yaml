# Render Blueprint: https://render.com/docs/blueprint-spec
# The storefront (apps/storefront) deploys to Vercel, not Render.
services:
  - type: web
    name: soko-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: soko-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: soko-redis
          property: connectionString

  - type: keyvalue
    name: soko-redis
    plan: free
    ipAllowList: [] # only reachable from services in this Render account

databases:
  - name: soko-db
    plan: free
